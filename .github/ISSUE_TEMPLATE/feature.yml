name: Feature request
description: Suggest a change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Sidenote deliberately keeps a small surface. Please explain the problem
        first; features outside the local-first scope may be declined.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This works without a server (local-first).
        - label: This requires the optional self-hosted Supabase backend.
