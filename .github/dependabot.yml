# Security updates and alerts remain enabled. Routine version-update PRs are
# paused (limit 0) to keep the branch list to main + the release branch; raise
# the limit to let Dependabot propose upgrades again.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
